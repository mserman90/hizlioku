name: Build iOS App

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
      - 'src/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & Xcode App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Project (Simulator & Sideload IPA)
        run: |
          cd ios/App
          # Build unsigned archive for generic iOS device / simulator
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../../build || \
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../../build

          cd ../..
          mkdir -p release/ios-build/Payload
          APP_PATH=$(find build -name "App.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" release/ios-build/Payload/
            cd release/ios-build
            zip -r ../hizlioku-ios.ipa Payload
            cd ../..
            echo "iOS IPA package built successfully at release/hizlioku-ios.ipa"
          else
            echo "Warning: App.app not found in build directory"
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hizlioku-ios-ipa
          path: release/hizlioku-ios.ipa
          retention-days: 14
          if-no-files-found: ignore
